<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실적 공유 시스템</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .admin-section { background: #fff3cd; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #ffeeba; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; padding: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .btn-blue { background: #007bff; }
        .btn-green { background: #28a745; }
        .view-section { border-top: 2px solid #dee2e6; padding-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: #e9ecef; }
        .update-time { font-size: 0.9em; color: #666; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h2>📈 센터별 마감 실적 현황판</h2>
    <div id="lastUpdate" class="update-time">데이터 로딩 중...</div>

    <details class="admin-section">
        <summary style="cursor:pointer; font-weight:bold;">⚙️ 관리자 데이터 업데이트 (나만 사용)</summary>
        <div style="margin-top:10px;">
            <textarea id="rawInput" placeholder="엑셀 데이터를 붙여넣으세요..."></textarea>
            <button class="btn btn-blue" onclick="processAndDownload()">1. 분석 및 데이터 파일 다운로드</button>
            <p style="font-size:0.85em; color:#856404;">* 다운로드된 'data.json' 파일을 깃허브에 올리면 전체 공지됩니다.</p>
        </div>
    </details>

    <div class="view-section">
        <h3>🏢 센터별 합계</h3>
        <table id="centerTable"><thead><tr><th>센터</th><th>콜건수</th></tr></thead><tbody></tbody></table>
        
        <h3>👥 담당자별 합계</h3>
        <table id="managerTable"><thead><tr><th>담당자</th><th>센터</th><th>콜건수</th></tr></thead><tbody></tbody></table>
    </div>
</div>

<script>
    const centers = ["고양", "의정부", "구리", "노원", "광진", "서대문", "춘천", "강릉", "원주"];

    // 1. 페이지 접속 시 깃허브에 있는 data.json을 자동으로 가져옴
    window.onload = function() {
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('lastUpdate').innerText = "최종 업데이트: " + data.updatedAt;
                renderTables(data.centerStats, data.managerStats);
            })
            .catch(err => {
                document.getElementById('lastUpdate').innerText = "업데이트된 데이터 파일이 없습니다.";
            });
    };

    // 2. 관리자가 데이터를 분석하고 파일로 만드는 함수
    function processAndDownload() {
        const text = document.getElementById('rawInput').value.trim();
        if(!text) return;

        let centerStats = {};
        let managerStats = {};
        const lines = text.split('\n');

        lines.forEach(line => {
            const parts = line.trim().split(/\s+/);
            if (parts.length < 2) return;
            const count = parseInt(parts[parts.length - 1]) || 0;
            const infoParts = parts.slice(0, parts.length - 1).join(" ").split('_');
            if (infoParts.length < 3) return;

            const center = infoParts[0].trim();
            const manager = infoParts[2].trim();
            const matchedCenter = centers.find(c => center.includes(c));

            if (matchedCenter) {
                centerStats[matchedCenter] = (centerStats[matchedCenter] || 0) + count;
                if (!managerStats[manager]) managerStats[manager] = { center: matchedCenter, count: 0 };
                managerStats[manager].count += count;
            }
        });

        // 파일로 저장할 객체 생성
        const finalData = {
            updatedAt: new Date().toLocaleString(),
            centerStats: centerStats,
            managerStats: managerStats
        };

        // JSON 파일 다운로드 실행
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(finalData));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "data.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        
        alert("data.json 파일이 다운로드되었습니다. 깃허브에 이 파일을 올려주세요!");
    }

    function renderTables(cStats, mStats) {
        const cBody = document.querySelector('#centerTable tbody');
        cBody.innerHTML = '';
        centers.forEach(c => {
            if (cStats[c]) cBody.innerHTML += `<tr><td>${c}</td><td><b>${cStats[c]}</b></td></tr>`;
        });

        const mBody = document.querySelector('#managerTable tbody');
        mBody.innerHTML = '';
        Object.keys(mStats).sort().forEach(m => {
            mBody.innerHTML += `<tr><td>${m}</td><td>${mStats[m].center}</td><td><b>${mStats[m].count}</b></td></tr>`;
        });
    }
</script>
</body>
</html>
