<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 실적 현황판 (강력추출형)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 5px; }
        .status-bar { text-align: right; font-size: 0.85em; color: #888; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box { background: #fff; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; }
        h3 { font-size: 1.1em; border-left: 5px solid #1a73e8; padding-left: 10px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #f0f0f0; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #f8f9fa; font-weight: bold; }
        .num { font-weight: bold; color: #d93025; }
        .center-tag { color: #1a73e8; font-weight: bold; }
        #loading { text-align: center; padding: 30px; font-weight: bold; color: #1a73e8; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 마감 실적 실시간 현황판</h2>
    <div id="updateTime" class="status-bar">데이터 동기화 중...</div>
    <div id="loading">데이터를 읽어오는 중입니다...</div>

    <div id="content" class="grid" style="display:none;">
        <div class="box">
            <h3>🏢 센터별 합계</h3>
            <table id="centerTable"><thead><tr><th>센터</th><th>건수</th></tr></thead><tbody></tbody></table>
        </div>
        <div class="box">
            <h3>👥 담당자별 합계</h3>
            <table id="managerTable"><thead><tr><th>담당자</th><th>센터</th><th>건수</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTooibgxnEq0T2BWeFQYDWmOUT7WEluZ08-OVVMxPvQ3lrbNnmI8URkXGmQSKC7ckOUbeBhEvjpa7Ld/pub?output=csv';
    const targetCenters = ["고양", "의정부", "구리", "노원", "광진", "서대문", "춘천", "강릉", "원주"];

    window.onload = function() {
        fetch(SHEET_URL)
            .then(res => res.text())
            .then(csv => {
                if(csv.includes("<!DOCTYPE html>")) {
                    document.getElementById('loading').innerText = "구글 시트 주소가 잘못되었습니다. '웹에 게시' 링크인지 확인해주세요.";
                    return;
                }
                processCSV(csv);
            })
            .catch(err => {
                document.getElementById('loading').innerText = "연결 오류가 발생했습니다.";
            });
    };

    function processCSV(csv) {
        const rows = csv.split('\n');
        let centerStats = {};
        let managerStats = {};

        rows.forEach((row, index) => {
            if (index === 0 || !row.trim()) return; 

            // 1. 전체 줄에서 숫자만 찾아내기 (문장 맨 뒤에 있는 숫자 추출)
            const line = row.trim();
            const matchCount = line.match(/(\d+)\s*$/); // 줄 끝에 붙은 숫자 찾기
            const count = matchCount ? parseInt(matchCount[1]) : 0;
            
            // 2. 텍스트 부분만 추출
            const infoText = line.replace(/(\d+)\s*$/, "").trim();

            // 3. 언더바(_)로 쪼개기
            const infoParts = infoText.split('_');
            
            // 정보가 부족해도(언더바가 3개 미만이어도) 일단 센터라도 찾음
            const rawText = infoParts[0] || ""; 
            const manager = infoParts[2] ? infoParts[2].trim() : "미확인";

            // 4. 센터 매칭
            const matchedCenter = targetCenters.find(c => rawText.includes(c));

            if (matchedCenter && count > 0) {
                centerStats[matchedCenter] = (centerStats[matchedCenter] || 0) + count;
                if (!managerStats[manager]) managerStats[manager] = { center: matchedCenter, count: 0 };
                managerStats[manager].count += count;
            }
        });

        render(centerStats, managerStats);
    }

    function render(cStats, mStats) {
        const cBody = document.querySelector('#centerTable tbody');
        const mBody = document.querySelector('#managerTable tbody');
        cBody.innerHTML = ''; mBody.innerHTML = '';

        Object.keys(cStats).sort().forEach(c => {
            cBody.innerHTML += `<tr><td class="center-tag">${c}</td><td class="num">${cStats[c]}</td></tr>`;
        });

        Object.keys(mStats).sort().forEach(m => {
            mBody.innerHTML += `<tr><td>${m}</td><td>${mStats[m].center}</td><td class="num">${mStats[m].count}</td></tr>`;
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'grid';
        document.getElementById('updateTime').innerText = "최종 업데이트: " + new Date().toLocaleString();
    }
</script>
</body>
</html>
