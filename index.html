<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 마감 현황판 (자동분석형)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f4f8; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; text-align: center; margin-bottom: 5px; }
        .status-bar { text-align: right; font-size: 0.85em; color: #777; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box { background: #fff; border: 1px solid #e1e4e8; padding: 15px; border-radius: 10px; }
        h3 { font-size: 1.1em; border-left: 5px solid #0056b3; padding-left: 10px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #f0f0f0; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #f8f9fa; }
        .num { font-weight: bold; color: #d9534f; }
        .center-tag { color: #0056b3; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 마감 실적 실시간 현황판</h2>
    <div id="updateTime" class="status-bar">데이터 동기화 중...</div>

    <div class="grid">
        <div class="box">
            <h3>🏢 센터별 합계</h3>
            <table id="centerTable"><thead><tr><th>센터</th><th>건수</th></tr></thead><tbody></tbody></table>
        </div>
        <div class="box">
            <h3>👥 담당자별 합계</h3>
            <table id="managerTable"><thead><tr><th>담당자</th><th>센터</th><th>건수</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTooibgxnEq0T2BWeFQYDWmOUT7WEluZ08-OVVMxPvQ3lrbNnmI8URkXGmQSKC7ckOUbeBhEvjpa7Ld/pub?output=csv';
    const targetCenters = ["고양", "의정부", "구리", "노원", "광진", "서대문", "춘천", "강릉", "원주"];

    window.onload = function() {
        fetch(SHEET_URL)
            .then(res => res.text())
            .then(csv => processCSV(csv));
    };

    function processCSV(csv) {
        const rows = csv.split('\n');
        let centerStats = {};
        let managerStats = {};

        rows.forEach((row, index) => {
            if (index === 0) return; // 헤더 제외

            // 구글 시트에서 한 행을 가져오되, 콤마(,)로 구분된 데이터를 합쳐서 분석
            // (사용자가 A열에만 데이터를 넣었을 경우를 대비)
            const line = row.trim();
            if (!line) return;

            // 1. 마지막 숫자(건수) 추출
            const parts = line.split(',');
            const count = parseInt(parts[parts.length - 1]) || 0;
            const infoText = parts.slice(0, parts.length - 1).join(" ");

            // 2. 언더바(_) 기준으로 텍스트 쪼개기
            const infoParts = infoText.split('_');
            if (infoParts.length < 3) return;

            const rawCenter = infoParts[0]; // "춘천,원주" 혹은 "(중복)춘천" 등
            const manager = infoParts[2].trim();

            // 3. 센터 매칭 (9개 센터 중 포함된 단어가 있는지 확인)
            const matchedCenter = targetCenters.find(c => rawCenter.includes(c)) || "기타";

            if (matchedCenter !== "기타") {
                centerStats[matchedCenter] = (centerStats[matchedCenter] || 0) + count;
                if (!managerStats[manager]) managerStats[manager] = { center: matchedCenter, count: 0 };
                managerStats[manager].count += count;
            }
        });

        render(centerStats, managerStats);
    }

    function render(cStats, mStats) {
        const cBody = document.querySelector('#centerTable tbody');
        Object.keys(cStats).sort().forEach(c => {
            cBody.innerHTML += `<tr><td class="center-tag">${c}</td><td class="num">${cStats[c]}</td></tr>`;
        });

        const mBody = document.querySelector('#managerTable tbody');
        Object.keys(mStats).sort().forEach(m => {
            mBody.innerHTML += `<tr><td>${m}</td><td>${mStats[m].center}</td><td class="num">${mStats[m].count}</td></tr>`;
        });
        document.getElementById('updateTime').innerText = "최종 업데이트: " + new Date().toLocaleString();
    }
</script>
</body>
</html>
