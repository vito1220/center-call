<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>센터별 누적 인입 콜 현황</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f1f3f5; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .admin-box { background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #ffeeba; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .btn-blue { background: #007bff; }
        .search-box { margin-bottom: 20px; padding: 15px; background: #e8f0fe; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
        .search-input { flex: 1; padding: 12px; border: 1px solid #abc; border-radius: 5px; font-size: 15px; }
        .update-time { font-size: 0.85em; color: #666; text-align: right; margin-bottom: 10px; }
        .section-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .box { background: #fff; border: 1px solid #dee2e6; padding: 15px; border-radius: 8px; }
        h3 { font-size: 1.1em; border-left: 5px solid #007bff; padding-left: 10px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #f8f9fa; font-weight: bold; }
        .num { font-weight: bold; color: #d9534f; }
        .highlight { color: #0056b3; font-weight: bold; }
        .total-row { background-color: #f8f9fa; font-weight: bold; }
        @media (max-width: 768px) { .section-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 센터별 누적 인입 콜 현황</h2>
    <div id="lastUpdate" class="update-time">데이터 로딩 중...</div>

    <details class="admin-box">
        <summary style="cursor:pointer; font-weight:bold;">⚙️ 데이터 업데이트 (나만 사용)</summary>
        <div style="margin-top:10px;">
            <textarea id="rawInput" placeholder="엑셀 데이터를 복사해서 붙여넣으세요..."></textarea>
            <button class="btn btn-blue" onclick="generateDataFile()">1. 분석 및 data.json 다운로드</button>
        </div>
    </details>

    <div class="search-box">
        🔍 <input type="text" id="searchInput" class="search-input" onkeyup="filterTable()" placeholder="판매점명 또는 담당자 이름을 입력하세요...">
    </div>

    <div class="section-grid">
        <div class="box">
            <h3>🏢 센터별 요약</h3>
            <table id="centerTable">
                <thead><tr><th>센터</th><th>총 건수</th></tr></thead>
                <tbody></tbody>
                <tfoot><tr id="totalSumRow" class="total-row"><td>총 합계</td><td id="grandTotal" class="num">0</td></tr></tfoot>
            </table>
        </div>

        <div class="box">
            <h3>🏪 상세 실적 현황</h3>
            <table id="detailTable">
                <thead><tr><th>센터</th><th>판매점명</th><th>담당자</th><th>건수</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const centers = ["고양", "의정부", "구리", "노원", "광진", "서대문", "춘천", "강릉", "원주"];
    let currentData = { cStats: {}, details: [], grandTotal: 0 };

    window.onload = function() {
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                currentData = data;
                document.getElementById('lastUpdate').innerText = "최종 업데이트: " + data.time;
                render();
            })
            .catch(() => {
                document.getElementById('lastUpdate').innerText = "데이터 파일(data.json)을 찾을 수 없습니다.";
            });
    };

    function generateDataFile() {
        const text = document.getElementById('rawInput').value.trim();
        if(!text) return;

        let cStats = {};
        let details = [];
        let grandTotal = 0;
        
        cStats["미등록 판매점"] = 0;

        text.split('\n').forEach(line => {
            const row = line.trim();
            if(!row) return;

            // 1. 마지막 숫자(건수) 추출
            const countMatch = row.match(/(\d+)\s*$/);
            if(!countMatch) return;
            const count = parseInt(countMatch[1]);
            grandTotal += count;

            // 2. 텍스트 부분 분석
            const infoText = row.replace(/(\d+)\s*$/, "").trim();

            if (infoText.includes("미등록 판매점")) {
                // "미등록 판매점" 텍스트가 직접 포함된 경우
                cStats["미등록 판매점"] += count;
                details.push({ center: "미등록", store: "미등록 판매점", manager: "-", count });
            } else {
                // 일반적인 언더바 형식 분석
                const infoParts = infoText.split('_');
                const centerMatch = centers.find(c => infoText.includes(c));
                const store = infoParts[1] ? infoParts[1].trim() : "정보없음";
                const manager = infoParts[2] ? infoParts[2].trim() : "-";

                if(centerMatch) {
                    cStats[centerMatch] = (cStats[centerMatch] || 0) + count;
                    details.push({ center: centerMatch, store, manager, count });
                } else {
                    cStats["미등록 판매점"] += count;
                    details.push({ center: "미등록", store: infoText, manager: "-", count });
                }
            }
        });

        const finalData = { time: new Date().toLocaleString(), cStats, details, grandTotal };
        const blob = new Blob([JSON.stringify(finalData)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = "data.json"; a.click();
        alert("data.json 파일이 생성되었습니다. 깃허브에 업로드해주세요!");
    }

    function render() {
        const cb = document.querySelector('#centerTable tbody');
        const db = document.querySelector('#detailTable tbody');
        cb.innerHTML = ''; db.innerHTML = '';

        centers.forEach(c => {
            if (currentData.cStats[c]) {
                cb.innerHTML += `<tr><td class="highlight">${c}</td><td class="num">${currentData.cStats[c]}</td></tr>`;
            }
        });

        if (currentData.cStats["미등록 판매점"]) {
            cb.innerHTML += `<tr style="color:#666; font-style:italic;"><td>미등록 판매점</td><td class="num">${currentData.cStats["미등록 판매점"]}</td></tr>`;
        }

        document.getElementById('grandTotal').innerText = (currentData.grandTotal || 0).toLocaleString();

        currentData.details.forEach(item => {
            db.innerHTML += `<tr><td>${item.center}</td><td>${item.store}</td><td>${item.manager}</td><td class="num">${item.count}</td></tr>`;
        });
    }

    function filterTable() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#detailTable tbody tr');
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(input) ? "" : "none";
        });
    }
</script>
</body>
</html>
