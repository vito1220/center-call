<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엑셀 마감 데이터 분석기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f8f9fa; padding: 20px; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #0056b3; text-align: center; margin-bottom: 30px; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        .input-box { background: #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        textarea { width: 100%; height: 200px; padding: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; resize: vertical; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; color: white; transition: 0.3s; }
        .btn-analyze { background-color: #007bff; }
        .btn-analyze:hover { background-color: #0056b3; }
        .btn-reset { background-color: #6c757d; flex: 0.3; }
        
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .box { background: #fff; border: 1px solid #dee2e6; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .full-width { grid-column: 1 / span 2; }
        h3 { color: #333; font-size: 1.1em; border-left: 5px solid #007bff; padding-left: 10px; margin-bottom: 15px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #f1f3f5; font-weight: bold; }
        tr:hover { background-color: #fdfdfe; }
        .highlight { font-weight: bold; color: #0056b3; }
        .count-val { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 엑셀 마감 데이터 통합 분석기</h2>
    
    <div class="input-box">
        <p style="margin-top:0; font-weight:bold;">📋 엑셀의 B열(내용)과 C열(인입건수) 영역을 복사해서 붙여넣으세요.</p>
        <textarea id="excelInput" placeholder="예시:&#10;의정부/라은/김한솔	5&#10;구리/금란통신/배지은	3"></textarea>
        <div class="btn-group">
            <button class="btn-analyze" onclick="processExcel()">데이터 분석하기</button>
            <button class="btn-reset" onclick="location.reload()">초기화</button>
        </div>
    </div>

    <div id="resultArea" style="display:none;">
        <div class="result-grid">
            <div class="box">
                <h3>🏢 센터별 콜건수 합계</h3>
                <table id="centerTable">
                    <thead><tr><th>센터명</th><th>총 콜건수</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="box">
                <h3>👥 담당자별 실적</h3>
                <table id="managerTable">
                    <thead><tr><th>담당자</th><th>센터</th><th>콜건수</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="box full-width">
                <h3>🏪 판매점별 세부 현황 (전체)</h3>
                <table id="storeTable">
                    <thead><tr><th>센터</th><th>판매점명</th><th>담당자</th><th>콜건수</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const targetCenters = ["고양", "의정부", "구리", "노원", "광진", "서대문", "춘천", "강릉", "원주"];

    function processExcel() {
        const input = document.getElementById('excelInput').value.trim();
        if (!input) { alert("데이터를 입력해주세요."); return; }

        const lines = input.split('\n');
        let centerData = {};
        let managerData = {};
        let storeDetails = [];

        lines.forEach(line => {
            // 탭 또는 공백으로 열 구분 (엑셀 복사 시 보통 탭으로 구분됨)
            const columns = line.split(/\t/);
            if (columns.length < 2) return;

            const fullInfo = columns[0].trim(); // B열: 센터/판매점/담당자
            const callCount = parseInt(columns[1].trim()) || 0; // C열: 인입건수

            // 슬래시(/) 기준으로 쪼개기
            const parts = fullInfo.split('/');
            
            let center = "기타";
            let store = "미분류";
            let manager = "미기재";

            if (parts.length >= 3) {
                center = parts[0].trim();
                store = parts[1].trim();
                manager = parts[2].trim();
            } else if (parts.length === 2) {
                center = parts[0].trim();
                manager = parts[1].trim();
            }

            // 지정된 9개 센터에 포함되는지 확인 및 데이터 정리
            if (targetCenters.some(c => center.includes(c))) {
                // 정확한 센터명 매칭 (예: '의정부센터' -> '의정부')
                const matchedCenter = targetCenters.find(c => center.includes(c));
                
                // 센터별 합산
                centerData[matchedCenter] = (centerData[matchedCenter] || 0) + callCount;
                
                // 담당자별 합산
                if (!managerData[manager]) managerData[manager] = { center: matchedCenter, count: 0 };
                managerData[manager].count += callCount;

                // 판매점 세부 리스트
                storeDetails.push({ center: matchedCenter, store, manager, count: callCount });
            }
        });

        renderTables(centerData, managerData, storeDetails);
    }

    function renderTables(centers, managers, stores) {
        // 센터 테이블
        const cBody = document.querySelector('#centerTable tbody');
        cBody.innerHTML = '';
        targetCenters.forEach(c => {
            if (centers[c]) {
                cBody.innerHTML += `<tr><td class="highlight">${c}</td><td class="count-val">${centers[c]}</td></tr>`;
            }
        });

        // 담당자 테이블
        const mBody = document.querySelector('#managerTable tbody');
        mBody.innerHTML = '';
        Object.keys(managers).sort().forEach(m => {
            mBody.innerHTML += `<tr><td>${m}</td><td>${managers[m].center}</td><td class="count-val">${managers[m].count}</td></tr>`;
        });

        // 판매점 테이블
        const sBody = document.querySelector('#storeTable tbody');
        sBody.innerHTML = '';
        stores.sort((a, b) => a.center.localeCompare(b.center)).forEach(s => {
            sBody.innerHTML += `<tr><td>${s.center}</td><td>${s.store}</td><td>${s.manager}</td><td class="count-val">${s.count}</td></tr>`;
        });

        document.getElementById('resultArea').style.display = 'block';
    }
</script>

</body>
</html>
