<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엑셀 데이터 통합 분석기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; text-align: center; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        .input-area { background: #f1f3f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        textarea { width: 100%; height: 180px; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; resize: vertical; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; color: white; transition: 0.2s; }
        .btn-run { background-color: #007bff; }
        .btn-run:hover { background-color: #0056b3; }
        .btn-reset { background-color: #6c757d; flex: 0.3; }
        
        .result-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .box { background: #fff; border: 1px solid #dee2e6; padding: 15px; border-radius: 8px; }
        .full { grid-column: 1 / span 2; }
        h3 { font-size: 1.1em; color: #333; margin-top: 0; border-left: 4px solid #007bff; padding-left: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #f8f9fa; }
        .total-val { font-weight: bold; color: #d9534f; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 마감 데이터 분석기 (언더바 형식)</h2>
    
    <div class="input-area">
        <p style="margin-top:0;">📋 엑셀의 데이터를 아래 칸에 붙여넣고 분석 버튼을 누르세요.</p>
        <textarea id="rawInput" placeholder="예시: 의정부_캠프비에스모바일_김하늘_(4/0/0)_0  8"></textarea>
        <div class="btn-group">
            <button class="btn-run" onclick="startAnalysis()">데이터 분석 시작</button>
            <button class="btn-reset" onclick="location.reload()">초기화</button>
        </div>
    </div>

    <div id="displayArea" style="display:none;">
        <div class="result-section">
            <div class="box">
                <h3>🏢 센터별 합계</h3>
                <table id="centerResult">
                    <thead><tr><th>센터명</th><th>인입건수</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="box">
                <h3>👥 담당자별 합계</h3>
                <table id="managerResult">
                    <thead><tr><th>담당자</th><th>센터</th><th>인입건수</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="box full">
                <h3>🏪 상세 내역 (센터/판매점/담당자)</h3>
                <table id="detailResult">
                    <thead><tr><th>센터</th><th>판매점명</th><th>담당자</th><th>인입건수</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const centers = ["고양", "의정부", "구리", "노원", "광진", "서대문", "춘천", "강릉", "원주"];

    function startAnalysis() {
        const text = document.getElementById('rawInput').value.trim();
        if (!text) return;

        let centerStats = {};
        let managerStats = {};
        let detailList = [];

        const lines = text.split('\n');

        lines.forEach(line => {
            // 1. 탭이나 공백으로 텍스트와 숫자를 분리 (마지막 인입건수 추출)
            const parts = line.trim().split(/\s+/);
            if (parts.length < 2) return;

            const count = parseInt(parts[parts.length - 1]) || 0; // 맨 뒤의 숫자
            const infoText = parts.slice(0, parts.length - 1).join(" "); // 앞의 텍스트 덩어리

            // 2. 언더바(_)로 정보 쪼개기
            const infoParts = infoText.split('_');
            if (infoParts.length < 3) return;

            const center = infoParts[0].trim();
            const store = infoParts[1].trim();
            const manager = infoParts[2].trim();

            // 지정된 센터인지 확인
            const matchedCenter = centers.find(c => center.includes(c));
            if (matchedCenter) {
                // 센터별 누적
                centerStats[matchedCenter] = (centerStats[matchedCenter] || 0) + count;

                // 담당자별 누적
                if (!managerStats[manager]) managerStats[manager] = { center: matchedCenter, count: 0 };
                managerStats[manager].count += count;

                // 상세 내역 추가
                detailList.push({ center: matchedCenter, store, manager, count });
            }
        });

        drawTables(centerStats, managerStats, detailList);
    }

    function drawTables(cStats, mStats, dList) {
        // 센터 테이블
        const cBody = document.querySelector('#centerResult tbody');
        cBody.innerHTML = '';
        centers.forEach(c => {
            if (cStats[c]) cBody.innerHTML += `<tr><td>${c}</td><td class="total-val">${cStats[c]}</td></tr>`;
        });

        // 담당자 테이블
        const mBody = document.querySelector('#managerResult tbody');
        mBody.innerHTML = '';
        Object.keys(mStats).sort().forEach(m => {
            mBody.innerHTML += `<tr><td>${m}</td><td>${mStats[m].center}</td><td class="total-val">${mStats[m].count}</td></tr>`;
        });

        // 상세 테이블
        const dBody = document.querySelector('#detailResult tbody');
        dBody.innerHTML = '';
        dList.forEach(d => {
            dBody.innerHTML += `<tr><td>${d.center}</td><td>${d.store}</td><td>${d.manager}</td><td class="total-val">${d.count}</td></tr>`;
        });

        document.getElementById('displayArea').style.display = 'block';
    }
</script>

</body>
</html>
